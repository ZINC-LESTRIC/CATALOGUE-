<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequel Sports — Product Catalogue 2025</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700;900&display=swap');

  :root {
    --navy: #0D1B2A;
    --navy-mid: #1A2E42;
    --navy-light: #243B55;
    --gold: #C9A84C;
    --gold-light: #E8C96C;
    --gold-pale: #F5E9C0;
    --cream: #FAF7F0;
    --white: #FFFFFF;
    --text-dark: #0D1B2A;
    --text-mid: #3A4F63;
    --text-muted: #6B7E8F;
    --page-w: 900px;
    --page-h: 600px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0A1520;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* ─── TOP BAR ─── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(10,21,32,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 32px;
  }
  .topbar-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 20px; letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(201,168,76,0.5), 0 0 40px rgba(201,168,76,0.2);
  }
  .topbar-info {
    color: rgba(255,255,255,0.5);
    font-size: 12px; letter-spacing: 1px;
  }
  .page-counter {
    font-family: 'Barlow Condensed', sans-serif;
    color: var(--gold); font-size: 14px; font-weight: 600;
  }

  /* ─── BOOK CONTAINER ─── */
  .book-scene {
    perspective: 2500px;
    width: var(--page-w);
    height: var(--page-h);
    position: relative;
    margin-top: 80px;
    margin-bottom: 60px;
  }

  .book {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
  }

  /* ─── PAGES ─── */
  .page {
    position: absolute;
    width: 100%; height: 100%;
    top: 0; left: 0;
    display: none;
    overflow: hidden;
    border-radius: 0 4px 4px 0;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      4px 0 20px rgba(0,0,0,0.3),
      inset -1px 0 0 rgba(255,255,255,0.05);
  }
  .page.active {
    display: block;
    animation: pageReveal 0.15s ease-out;
  }
  .page.flip-out {
    display: block;
    animation: flipOut 0.35s ease-in forwards;
  }
  .page.flip-in {
    display: block;
    animation: flipIn 0.35s ease-out forwards;
  }

  @keyframes pageReveal {
    from { opacity:0; transform: perspective(1000px) rotateY(-8deg); }
    to   { opacity:1; transform: perspective(1000px) rotateY(0deg); }
  }
  @keyframes flipOut {
    from { transform: perspective(1200px) rotateY(0deg); opacity:1; }
    50%  { transform: perspective(1200px) rotateY(-90deg); opacity:0.6; }
    to   { transform: perspective(1200px) rotateY(-180deg); opacity:0; }
  }
  @keyframes flipIn {
    from { transform: perspective(1200px) rotateY(180deg); opacity:0; }
    50%  { transform: perspective(1200px) rotateY(90deg); opacity:0.6; }
    to   { transform: perspective(1200px) rotateY(0deg); opacity:1; }
  }

  /* ─── BOOK SPINE SHADOW ─── */
  .book-spine {
    position: absolute;
    left: -8px; top: 2px; bottom: 2px; width: 8px;
    background: linear-gradient(to right, #020608, #0D1B2A);
    border-radius: 2px 0 0 2px;
    box-shadow: -4px 0 16px rgba(0,0,0,0.6);
    z-index: 10;
  }

  /* ─── NAVIGATION ─── */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(10,21,32,0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(201,168,76,0.15);
    display: flex; align-items: center; justify-content: center;
    gap: 0;
    padding: 10px 0;
  }
  .nav-btn {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.5);
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 18px;
    transition: color 0.2s;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn:hover { color: var(--gold); }
  .nav-btn.active { color: var(--gold); }
  .nav-arrow {
    background: none; border: 1px solid rgba(201,168,76,0.4); cursor: pointer;
    color: var(--gold); font-size: 18px; padding: 6px 20px;
    border-radius: 3px;
    transition: all 0.2s;
    margin: 0 20px;
  }
  .nav-arrow:hover {
    background: rgba(201,168,76,0.1);
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(201,168,76,0.3);
  }
  .nav-divider {
    width: 1px; height: 24px;
    background: rgba(255,255,255,0.08);
    margin: 0 4px;
  }

  /* ======================================================
     SLIDE DESIGNS
  ====================================================== */

  /* ─── SLIDE 1: COVER ─── */
  .slide-cover {
    background: var(--navy);
    position: relative;
    overflow: hidden;
  }
  .slide-cover::before {
    content: '';
    position: absolute;
    top: -50%; left: -20%;
    width: 140%; height: 200%;
    background: radial-gradient(ellipse at 30% 40%, rgba(201,168,76,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 60%, rgba(13,91,156,0.2) 0%, transparent 50%);
  }
  .cover-grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .cover-content {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 0;
  }
  .cover-top-strip {
    background: var(--gold);
    height: 4px;
    width: 100%;
  }
  .cover-main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 40px 60px;
    gap: 40px;
  }
  .cover-left {}
  .cover-tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 4px;
    color: var(--gold); text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0.8;
  }
  .cover-brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    line-height: 0.9;
    margin-bottom: 20px;
  }
  .cover-brand .sequel {
    display: block; font-size: 72px; letter-spacing: 6px;
    color: var(--white);
    text-shadow: 0 0 30px rgba(201,168,76,0.15);
  }
  .cover-brand .sports {
    display: block; font-size: 72px; letter-spacing: 6px;
    color: var(--gold);
    text-shadow:
      0 0 20px rgba(201,168,76,0.6),
      0 0 40px rgba(201,168,76,0.3),
      0 0 80px rgba(201,168,76,0.15);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(201,168,76,0.6), 0 0 40px rgba(201,168,76,0.3), 0 0 80px rgba(201,168,76,0.15); }
    50%       { text-shadow: 0 0 30px rgba(201,168,76,0.9), 0 0 60px rgba(201,168,76,0.5), 0 0 100px rgba(201,168,76,0.25); }
  }
  .cover-subtitle {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
    letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase;
    margin-bottom: 24px;
  }
  .cover-divider-line {
    width: 60px; height: 1px;
    background: linear-gradient(to right, var(--gold), transparent);
    margin-bottom: 20px;
  }
  .cover-product-list {
    font-family: 'Inter', sans-serif; font-size: 11px;
    color: rgba(255,255,255,0.35); letter-spacing: 1.5px;
    line-height: 1.8;
  }
  .cover-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 24px;
  }
  .cover-badge {
    border: 1px solid rgba(201,168,76,0.4);
    padding: 20px 24px;
    text-align: center;
    background: rgba(201,168,76,0.04);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 30px rgba(201,168,76,0.08);
  }
  .cover-badge .big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 48px; font-weight: 900; color: var(--gold);
    text-shadow: 0 0 20px rgba(201,168,76,0.4);
    line-height: 1;
    display: block;
  }
  .cover-badge .label {
    font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
    text-transform: uppercase; display: block; margin-top: 4px;
  }
  .cover-year-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
    border-top: 1px solid rgba(201,168,76,0.2);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding: 8px 0; text-align: right;
    width: 100%;
  }
  .cover-location {
    font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 1.5px;
    text-align: right;
  }
  .cover-bottom {
    background: rgba(201,168,76,0.06);
    border-top: 1px solid rgba(201,168,76,0.15);
    padding: 12px 60px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cover-bottom-text {
    font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .cover-web {
    font-size: 10px; letter-spacing: 1px; color: var(--gold);
    opacity: 0.7;
  }

  /* ─── SLIDE 2: TABLE OF CONTENTS ─── */
  .slide-toc {
    background: var(--cream);
    position: relative;
    overflow: hidden;
  }
  .toc-sidebar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 220px;
    background: var(--navy);
    display: flex; flex-direction: column;
    padding: 40px 32px;
    justify-content: space-between;
  }
  .toc-sidebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px; color: var(--white); line-height: 1.2;
    margin-bottom: 12px;
  }
  .toc-sidebar-subtitle {
    font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.3);
    text-transform: uppercase; line-height: 1.6;
  }
  .toc-sidebar-gold-line {
    height: 2px; background: var(--gold);
    box-shadow: 0 0 10px rgba(201,168,76,0.5);
    margin: 20px 0;
    width: 40px;
  }
  .toc-sidebar-stats {
    display: flex; flex-direction: column; gap: 16px;
  }
  .toc-stat-item {}
  .toc-stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 900; color: var(--gold);
    text-shadow: 0 0 12px rgba(201,168,76,0.4);
    line-height: 1;
  }
  .toc-stat-label {
    font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
    text-transform: uppercase;
  }
  .toc-content {
    margin-left: 220px;
    padding: 36px 40px;
    height: 100%;
  }
  .toc-eyebrow {
    font-size: 10px; letter-spacing: 3px; color: var(--gold);
    text-transform: uppercase; font-weight: 600; margin-bottom: 8px;
  }
  .toc-heading {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--navy); margin-bottom: 24px;
    font-style: italic;
  }
  .toc-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px 24px;
  }
  .toc-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(13,27,42,0.08);
    cursor: pointer;
    transition: all 0.2s;
  }
  .toc-item:hover .toc-item-num { color: var(--navy); }
  .toc-item:hover .toc-item-title { color: var(--gold); }
  .toc-item-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 700; color: var(--gold);
    min-width: 28px; line-height: 1;
    transition: color 0.2s;
  }
  .toc-item-title {
    font-size: 13px; font-weight: 600; color: var(--navy);
    transition: color 0.2s;
    line-height: 1.2;
  }
  .toc-item-sub {
    font-size: 10px; color: var(--text-muted); margin-top: 1px;
  }

  /* ─── SLIDE 3: ABOUT ─── */
  .slide-about {
    background: var(--navy);
    display: grid; grid-template-columns: 1fr 1fr;
    overflow: hidden;
    position: relative;
  }
  .about-left {
    padding: 50px 48px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; z-index: 2;
  }
  .about-right {
    background: linear-gradient(135deg, #1A2E42 0%, #0D1B2A 100%);
    padding: 48px 44px;
    position: relative;
  }
  .about-right::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 30%, rgba(201,168,76,0.06) 0%, transparent 60%);
  }
  .about-eyebrow {
    font-size: 10px; letter-spacing: 3px; color: var(--gold);
    text-transform: uppercase; font-weight: 600; margin-bottom: 16px;
  }
  .about-heading {
    font-family: 'Playfair Display', serif;
    font-size: 42px; line-height: 1.05; color: var(--white);
    margin-bottom: 20px;
  }
  .about-heading em { color: var(--gold); font-style: italic; }
  .about-story {
    font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.6);
    margin-bottom: 28px;
  }
  .about-stats-row {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  }
  .about-stat-box {
    padding: 16px;
    border: 1px solid rgba(201,168,76,0.2);
    background: rgba(201,168,76,0.04);
  }
  .about-stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px; font-weight: 900; color: var(--gold);
    text-shadow: 0 0 16px rgba(201,168,76,0.4);
    line-height: 1;
  }
  .about-stat-label {
    font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
    text-transform: uppercase; margin-top: 2px;
  }
  .about-pillars {
    display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 2;
  }
  .pillar {
    padding: 18px 20px;
    border-left: 2px solid var(--gold);
    background: rgba(255,255,255,0.03);
  }
  .pillar-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--gold);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
  }
  .pillar-text {
    font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.6;
  }
  .sialkot-badge {
    position: relative; z-index: 2;
    margin-top: 20px;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.25);
    padding: 12px 16px;
    font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.5;
  }
  .sialkot-badge strong { color: var(--gold); }

  /* ─── PRODUCT CATEGORY SLIDES ─── */
  .slide-product {
    background: var(--white);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .product-header {
    background: var(--navy);
    padding: 24px 48px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .product-category-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    color: var(--gold); text-transform: uppercase;
  }
  .product-category-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px; color: var(--white);
    line-height: 1.1;
  }
  .product-category-title em { color: var(--gold); font-style: italic; }
  .product-header-right {
    text-align: right;
  }
  .product-sub-cats {
    font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 1px;
    max-width: 280px; text-align: right; line-height: 1.6;
  }
  .product-body {
    flex: 1; padding: 28px 48px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px 20px;
    background: var(--cream);
  }
  .product-card {
    background: var(--white);
    padding: 18px 18px;
    border-top: 3px solid var(--gold);
    box-shadow: 0 2px 12px rgba(13,27,42,0.06);
    transition: all 0.2s;
  }
  .product-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(13,27,42,0.12);
  }
  .product-card-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--navy);
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .product-card-desc {
    font-size: 11px; color: var(--text-muted); line-height: 1.7;
  }
  .product-card-desc li {
    list-style: none; padding: 1px 0;
  }
  .product-card-desc li::before {
    content: '—'; margin-right: 5px; color: var(--gold); font-size: 9px;
  }
  .product-footer {
    background: var(--navy);
    padding: 10px 48px;
    font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 1.5px;
    display: flex; justify-content: space-between;
  }

  /* ─── CUSTOMISATION SLIDE ─── */
  .slide-custom {
    background: var(--navy);
    display: grid; grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }
